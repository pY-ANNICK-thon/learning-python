<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rechentrainer</title>
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #6b7489;
    --accent: #3b6cf6; --ok: #1f9d55; --err: #d64545; --border: #dde2ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1c212b; --text: #e7ebf3; --muted: #8b94a7;
      --accent: #6b93ff; --ok: #3ccf7f; --err: #ff6b6b; --border: #2c3341;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { margin: 0 0 16px; font-size: 1.6rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button {
    font: inherit; cursor: pointer; border-radius: 10px; padding: 10px 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  label { color: var(--muted); font-size: .9rem; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
           background: var(--card); color: var(--text); }
  .task { font-size: 2.6rem; font-weight: 700; text-align: center; margin: 8px 0 16px;
          font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 8px; }
  input[type=number] {
    flex: 1; min-width: 0; font: inherit; font-size: 1.5rem; padding: 10px 12px;
    border-radius: 10px; border: 2px solid var(--border); background: var(--bg); color: var(--text);
  }
  input[type=number]:focus { outline: none; border-color: var(--accent); }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 10px 18px; }
  .feedback { min-height: 1.5em; text-align: center; margin-top: 12px; font-weight: 600; }
  .feedback.ok { color: var(--ok); } .feedback.err { color: var(--err); }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; text-align: center; }
  .stat b { display: block; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .history { max-height: 180px; overflow-y: auto; font-variant-numeric: tabular-nums; margin: 0;
             padding: 0; list-style: none; }
  .history li { padding: 4px 0; border-bottom: 1px solid var(--border); display: flex;
                justify-content: space-between; }
  .history .ok { color: var(--ok); } .history .err { color: var(--err); }
  .badge { min-height: 1.3em; text-align: center; color: var(--accent); font-weight: 600; font-size: .9rem; }
  .muted { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <h1>Rechentrainer</h1>

  <section class="card">
    <div class="modes" id="modes">
      <button data-mode="klein">Kleines Einmaleins</button>
      <button data-mode="gross">Großes Einmaleins</button>
      <button data-mode="addsub">Addieren &amp; Subtrahieren</button>
      <button data-mode="muldiv">Multiplizieren &amp; Dividieren</button>
    </div>
    <div class="row" id="levelRow">
      <label for="level">Schwierigkeit:</label>
      <select id="level">
        <option value="1">Leicht</option>
        <option value="2" selected>Mittel</option>
        <option value="3">Schwer</option>
      </select>
    </div>
  </section>

  <section class="card">
    <div class="badge" id="badge"></div>
    <div class="task" id="task">–</div>
    <form id="form" autocomplete="off">
      <input type="number" id="answer" inputmode="numeric" placeholder="Ergebnis" required>
      <button class="primary" type="submit">Prüfen</button>
    </form>
    <div class="feedback" id="feedback"></div>
    <div class="row" style="justify-content:center">
      <button type="button" id="skip">Überspringen</button>
      <button type="button" id="reset">Statistik zurücksetzen</button>
    </div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="sRight">0</b><span>Richtig</span></div>
      <div class="stat"><b id="sWrong">0</b><span>Falsch</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Serie</span></div>
      <div class="stat"><b id="sRate">–</b><span>Quote</span></div>
      <div class="stat"><b id="sReview">0</b><span>Zu wiederholen</span></div>
    </div>
  </section>

  <section class="card">
    <p class="muted" style="margin-top:0">Verlauf</p>
    <ul class="history" id="history"></ul>
  </section>
</main>

<script>
  // Zufallszahl zwischen min und max (beide inklusive)
  const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

  // Zahlenbereiche je Schwierigkeit für Plus/Minus und Mal/Geteilt
  const RANGES = {
    addsub: { 1: 20, 2: 100, 3: 1000 },
    muldiv: { 1: 10, 2: 20, 3: 50 },
  };

  // Jeder Modus besteht aus einer oder mehreren Rechenarten ("ops").
  // Eine op hat: name, size (Anzahl aller möglichen Aufgaben) und
  // make() -> zufällige Aufgabe { text, result }.
  const modes = {
    klein: () => [{
      name: "mal", size: 10 * 10,
      make() { const a = rnd(1, 10), b = rnd(1, 10); return { text: `${a} · ${b}`, result: a * b }; },
    }],
    gross: () => [{
      // alle Paare 1–20 · 1–20, bei denen mindestens ein Faktor ≥ 11 ist
      name: "mal", size: 20 * 20 - 10 * 10,
      make() {
        let a, b;
        do { a = rnd(1, 20); b = rnd(1, 20); } while (a <= 10 && b <= 10);
        return { text: `${a} · ${b}`, result: a * b };
      },
    }],
    addsub: level => {
      const max = RANGES.addsub[level];
      return [
        { name: "plus", size: (max + 1) ** 2,
          make() { const a = rnd(0, max), b = rnd(0, max); return { text: `${a} + ${b}`, result: a + b }; } },
        { name: "minus", size: (max + 1) * (max + 2) / 2,   // nur a ≥ b → kein negatives Ergebnis
          make() {
            let a = rnd(0, max), b = rnd(0, max);
            if (b > a) [a, b] = [b, a];
            return { text: `${a} − ${b}`, result: a - b };
          } },
      ];
    },
    muldiv: level => {
      const max = RANGES.muldiv[level];
      return [
        { name: "mal", size: (max - 1) ** 2,
          make() { const a = rnd(2, max), b = rnd(2, max); return { text: `${a} · ${b}`, result: a * b }; } },
        { name: "geteilt", size: (max - 1) ** 2,             // (a·b) : b = a → immer ohne Rest
          make() { const a = rnd(2, max), b = rnd(2, max); return { text: `${a * b} : ${b}`, result: a }; } },
      ];
    },
  };

  // Pro Modus/Stufe/Rechenart merken, welche Aufgaben schon dran waren.
  // Erst wenn ALLE einmal dran waren, wird das Gedächtnis geleert ("Runde").
  const seen = new Map();

  function drawTask(mode, level) {
    const ops = modes[mode](level);
    const op = ops[rnd(0, ops.length - 1)];          // Rechenart 50/50 wählen
    const key = `${mode}|${level}|${op.name}`;
    if (!seen.has(key)) seen.set(key, new Set());
    const used = seen.get(key);
    if (used.size >= op.size) used.clear();          // Runde fertig → neu mischen

    let task;
    do { task = op.make(); }
    // keine Wiederholung in der Runde und nicht dieselbe Aufgabe direkt nochmal
    // (außer es ist die allerletzte freie Aufgabe der Runde → sonst Endlosschleife)
    while (used.has(task.text) ||
           (task.text === state.current?.text && used.size < op.size - 1));
    used.add(task.text);
    return task;
  }

  const $ = id => document.getElementById(id);
  const state = { mode: "klein", current: null, right: 0, wrong: 0, streak: 0, count: 0 };

  // ---- Wiederholen wie bei Anki ----
  // Falsche/übersprungene Aufgaben kommen in eine Warteschlange und tauchen
  // nach ein paar Aufgaben wieder auf. Erst wenn sie 2x richtig gelöst wurden
  // (kurzer + längerer Abstand), gelten sie als gelernt.
  const STEPS = [3, 8];   // Abstand in Aufgaben: erst nach 3, dann nach 8
  let reviews = [];       // { text, result, mode, level, step, due }

  const levelOf = () => Number($("level").value);

  function scheduleReview(task, mode, level) {
    let r = reviews.find(r => r.text === task.text && r.mode === mode && r.level === level);
    if (!r) { r = { ...task, mode, level }; reviews.push(r); }
    r.step = 0;
    r.due = state.count + STEPS[0];
  }

  function reviewAnsweredCorrectly(r) {
    r.step++;
    if (r.step >= STEPS.length) reviews = reviews.filter(x => x !== r);  // gelernt
    else r.due = state.count + STEPS[r.step];
  }

  function nextDueReview() {
    // fällige Wiederholung im aktuellen Modus/Stufe, die am längsten wartet
    return reviews
      .filter(r => r.mode === state.mode && r.level === levelOf() && r.due <= state.count
                   && r.text !== state.current?.text)
      .sort((a, b) => a.due - b.due)[0];
  }

  function newTask() {
    state.count++;
    const r = nextDueReview();
    state.current = r ? { text: r.text, result: r.result, review: r }
                      : drawTask(state.mode, levelOf());
    $("task").textContent = state.current.text + " = ?";
    $("badge").textContent = r ? "🔁 Wiederholung" : "";
    const open = reviews.filter(x => x.mode === state.mode && x.level === levelOf()).length;
    $("sReview").textContent = open;
    $("answer").value = "";
    $("answer").focus();
  }

  function setMode(mode) {
    state.mode = mode;
    document.querySelectorAll("#modes button").forEach(b =>
      b.classList.toggle("active", b.dataset.mode === mode));
    // Einmaleins-Modi haben keine Schwierigkeitsstufe
    $("levelRow").style.display = (mode === "addsub" || mode === "muldiv") ? "flex" : "none";
    $("feedback").textContent = "";
    newTask();
  }

  function updateStats() {
    $("sRight").textContent = state.right;
    $("sWrong").textContent = state.wrong;
    $("sStreak").textContent = state.streak;
    const total = state.right + state.wrong;
    $("sRate").textContent = total ? Math.round(state.right / total * 100) + "\u00a0%" : "–";
  }

  function addHistory(text, given, correct, ok) {
    const li = document.createElement("li");
    li.innerHTML = `<span>${text} = ${correct}</span>` +
      `<span class="${ok ? "ok" : "err"}">${ok ? "✓" : "✗ " + given}</span>`;
    $("history").prepend(li);
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const raw = $("answer").value.trim();
    if (raw === "") return;
    const given = Number(raw);
    const { text, result, review } = state.current;
    const ok = given === result;
    if (ok && review) reviewAnsweredCorrectly(review);
    if (!ok) scheduleReview({ text, result }, state.mode, levelOf());
    const fb = $("feedback");

    if (ok) {
      state.right++; state.streak++;
      fb.textContent = state.streak >= 5 ? `Richtig! ${state.streak} in Folge 🔥` : "Richtig!";
      fb.className = "feedback ok";
    } else {
      state.wrong++; state.streak = 0;
      fb.textContent = `Falsch – ${text} = ${result}`;
      fb.className = "feedback err";
    }
    addHistory(text, given, result, ok);
    updateStats();
    newTask();
  });

  $("skip").addEventListener("click", () => {
    const { text, result } = state.current;
    scheduleReview({ text, result }, state.mode, levelOf());
    $("feedback").textContent = `Übersprungen – ${text} = ${result}`;
    $("feedback").className = "feedback";
    state.streak = 0;
    updateStats();
    newTask();
  });

  $("reset").addEventListener("click", () => {
    Object.assign(state, { right: 0, wrong: 0, streak: 0 });
    reviews = [];
    $("history").innerHTML = "";
    $("feedback").textContent = "";
    updateStats();
    newTask();
  });

  $("level").addEventListener("change", newTask);
  document.querySelectorAll("#modes button").forEach(b =>
    b.addEventListener("click", () => setMode(b.dataset.mode)));

  setMode("klein");
</script>
</body>
</html>
